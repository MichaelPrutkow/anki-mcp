name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Install Graphviz
        run: ${{ runner.os == 'macOS' && 'brew install graphviz' || 'sudo apt-get update && sudo apt-get install -y graphviz' }}
      - name: Lint
        run: |
          uvx ruff check src tests server.py
          uvx ruff format --check src tests server.py
      - name: Test
        run: uv run --frozen pytest
